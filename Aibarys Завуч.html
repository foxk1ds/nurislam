<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: same red/white identity; a dean's panel with top tabs (overview, incidents, students, report) and a slide-in form for new incidents. */
:root {
  --bg: #F7F4F4;
  --surface: #FFFFFF;
  --fg: #1E1315;
  --muted: #6B5C5F;
  --line: #E7DEDF;
  --red: #C8102E;
  --red-text: #B20E29;
  --red-soft: #FCE8EB;
  --on-red: #FFFFFF;
  --band: #C8102E;
  --chip: #EFE8E9;
  --hi: #137A3A; --hi-bg: #DDF3E4;
  --mid: #8A5A06; --mid-bg: #FBEFC9;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #170D0F; --surface: #241619; --fg: #F6ECEE; --muted: #B7A3A7; --line: #3A2629;
    --red: #E0243D; --red-text: #FF7A8C; --red-soft: #43191F; --on-red: #FFFFFF; --band: #B30F29;
    --chip: #332326; --hi: #6FD394; --hi-bg: #163626; --mid: #EDC25B; --mid-bg: #3A2F12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #170D0F; --surface: #241619; --fg: #F6ECEE; --muted: #B7A3A7; --line: #3A2629;
  --red: #E0243D; --red-text: #FF7A8C; --red-soft: #43191F; --on-red: #FFFFFF; --band: #B30F29;
  --chip: #332326; --hi: #6FD394; --hi-bg: #163626; --mid: #EDC25B; --mid-bg: #3A2F12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.muted { color: var(--muted); }
h3 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }

.band { position: relative; overflow: hidden; background: var(--band); color: #fff; border-radius: 20px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.band .deco { position: absolute; right: -40px; top: -50px; width: 220px; height: 220px; opacity: .16; pointer-events: none; }
.brand { display: flex; align-items: center; gap: 12px; position: relative; }
.word { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1; letter-spacing: .01em; }
.sch { font-size: 13px; opacity: .85; margin-top: 4px; }
.bandrow { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.bandrow .st { font-weight: 600; overflow-wrap: anywhere; }
.pill { display: inline-block; background: rgba(255,255,255,.18); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 500; margin-left: 8px; }
.bandrow button { border: 0; background: #fff; color: var(--red-text); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; }
:root[data-theme="dark"] .bandrow button { color: #B20E29; }

.panel { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ch { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.empty { color: var(--muted); font-size: 15px; padding: 4px 0; }
.note { background: var(--red-soft); color: var(--red-text); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.ttl { font-family: var(--font-display); font-weight: 500; font-size: 20px; margin: 0; text-wrap: balance; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.err { color: var(--red-text); font-size: 14px; min-height: 1.2em; }
.msg { font-size: 14px; color: var(--hi); min-height: 1.2em; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.seg button { border: 0; background: transparent; padding: 9px 6px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--red); color: var(--on-red); }
.form { display: grid; gap: 12px; }
.form label, label.fl { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
input[type="text"], input[type="date"], input[type="time"], select, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
textarea { min-height: 84px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 0; background: var(--red); color: var(--on-red); font-weight: 600; padding: 11px 16px; border-radius: 10px; }
.btn.alt { background: var(--chip); color: var(--fg); }
.btn.sm { padding: 8px 12px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.lnk { border: 0; background: none; color: var(--red-text); font-weight: 600; font-size: 14px; padding: 2px 0; }
.chk { display: flex !important; grid-auto-flow: unset; align-items: center; gap: 8px !important; color: var(--fg) !important; font-size: 15px !important; }
.chk input { width: 20px; height: 20px; accent-color: var(--red); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.stat .v { font-family: var(--font-display); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; color: var(--red-text); }
.stat .l { font-size: 13px; color: var(--muted); }

.hb { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 28px; gap: 10px; align-items: center; font-size: 14px; }
.hb .lb { overflow-wrap: anywhere; }
.hb .tr { height: 10px; border-radius: 5px; background: var(--chip); overflow: hidden; }
.hb .tr i { display: block; height: 100%; background: var(--red); border-radius: 5px; }
.hb b { text-align: right; font-variant-numeric: tabular-nums; }
svg.chart { width: 100%; height: auto; display: block; }
.chart .axis { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.chart .val { fill: var(--fg); font-size: 11px; font-weight: 600; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .bar { fill: var(--red); }

.tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 8px; background: var(--chip); color: var(--fg); white-space: nowrap; }
.tag.red { background: var(--red); color: var(--on-red); }
.tag.soft { background: var(--red-soft); color: var(--red-text); }
.tag.mid { background: var(--mid-bg); color: var(--mid); }
.tag.hi { background: var(--hi-bg); color: var(--hi); }
details.inc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
details.inc[open] { border-color: var(--red); }
details.inc summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 12px 14px; align-items: start; }
details.inc summary::-webkit-details-marker { display: none; }
.inc .t1 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.inc .who { font-weight: 600; overflow-wrap: anywhere; }
.inc .sb { font-size: 13px; color: var(--muted); }
.inc .body { padding: 0 14px 14px; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.inc dl { margin: 0; display: grid; gap: 6px; font-size: 14px; }
.inc dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.inc dd { margin: 0; overflow-wrap: anywhere; }
.review { background: var(--red-soft); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.rowx { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.rowx .nm { font-weight: 600; overflow-wrap: anywhere; }
.rowx .sb { font-size: 13px; color: var(--muted); }
.cnt { min-width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; background: var(--chip); }
.cnt.hot { background: var(--red); color: var(--on-red); }
pre.rep { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-body); font-size: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.ai { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; background: var(--chip); border-radius: 12px; padding: 12px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) { .seg button { transition: background-color .15s, color .15s; } }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } .word { font-size: 24px; } .hb { grid-template-columns: minmax(0, 110px) minmax(0, 1fr) 26px; } }
</style>

<div class="wrap">
  <header class="band">
    <svg class="deco" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="95" fill="none" stroke="#fff" stroke-width="10"/><circle cx="100" cy="100" r="62" fill="none" stroke="#fff" stroke-width="10"/><circle cx="100" cy="100" r="30" fill="#fff"/></svg>
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><defs><mask id="cm"><rect width="44" height="44" fill="#fff"/><circle cx="27" cy="17" r="11" fill="#000"/></mask></defs><circle cx="22" cy="22" r="22" fill="rgba(255,255,255,.18)"/><circle cx="22" cy="23" r="14" fill="#fff" mask="url(#cm)"/><circle cx="31" cy="12" r="2.4" fill="#fff"/></svg>
      <div><div class="word">Aibarys</div><div class="sch">Дисциплина и инциденты · Aqtau International School</div></div>
    </div>
    <div class="bandrow">
      <div><span class="st" id="who">Подключаюсь…</span><span class="pill" id="role" hidden></span></div>
      <button id="newBtn" type="button" hidden>Новый инцидент</button>
    </div>
  </header>

  <div class="note" id="status" role="status" hidden></div>

  <main>
    <section class="card" id="v-fatal" hidden></section>

    <section class="panel" id="v-form" hidden>
      <h2 class="ttl">Новый инцидент</h2>
      <form class="card form" id="iform" novalidate>
        <label for="ftype">Что произошло<select id="ftype"></select></label>
        <div><div class="muted" style="font-size:14px;margin-bottom:6px">Тяжесть</div>
          <div class="seg" id="fsev" role="group" aria-label="Тяжесть">
            <button type="button" data-s="1" aria-pressed="true">Лёгкая</button><button type="button" data-s="2" aria-pressed="false">Средняя</button><button type="button" data-s="3" aria-pressed="false">Тяжёлая</button>
          </div></div>
        <div class="two"><label for="fdate">Дата<input type="date" id="fdate"></label><label for="ftime">Время<input type="time" id="ftime"></label></div>
        <label for="fplace">Где<select id="fplace"></select></label>
        <label for="fwho">Участники: по одному в строке, имя и класс через запятую<textarea id="fwho" placeholder="Тимур Ахметов, 8Б&#10;Данияр Ли, 8Б"></textarea></label>
        <label for="fwhat">Что произошло<textarea id="fwhat" maxlength="800"></textarea></label>
        <label for="fwhy">Почему это произошло (объяснение участников)<textarea id="fwhy" maxlength="800"></textarea></label>
        <label for="fact">Что уже сделано (разняли, вызвали медсестру, беседа)<textarea id="fact" maxlength="600" style="min-height:64px"></textarea></label>
        <label class="chk" for="finj"><input type="checkbox" id="finj"> Есть травмы, оказана помощь</label>
        <label class="chk" for="fpar"><input type="checkbox" id="fpar"> Родителей уже вызвали или уведомили</label>
        <label for="fby">Кто сообщает<input type="text" id="fby" maxlength="60"></label>
        <div class="err" id="ferr" role="alert"></div>
        <div class="acts"><button class="btn" type="submit" id="fsave">Отправить завучу</button><button class="btn alt" type="button" id="fcancel">Отмена</button></div>
      </form>
    </section>

    <section class="panel" id="v-teacher" hidden>
      <h2 class="ttl">Ваши сообщения завучу</h2>
      <div class="muted" style="font-size:15px">Здесь видны только ваши инциденты. Ошибочное сообщение можно удалить в течение 15 минут после отправки.</div>
      <div class="msg" id="tmsg" aria-live="polite"></div>
      <div class="panel" id="tlist"></div>
    </section>

    <section class="panel" id="v-dean" hidden>
      <div class="seg" id="tabs" role="group" aria-label="Раздел">
        <button type="button" data-t="over" aria-pressed="true">Обзор</button>
        <button type="button" data-t="list" aria-pressed="false">Инциденты</button>
        <button type="button" data-t="stud" aria-pressed="false">Ученики</button>
        <button type="button" data-t="rep" aria-pressed="false">Отчёт</button>
      </div>
      <div class="seg" id="period" role="group" aria-label="Период">
        <button type="button" data-p="7" aria-pressed="false">7 дней</button>
        <button type="button" data-p="30" aria-pressed="true">30 дней</button>
        <button type="button" data-p="0" aria-pressed="false">Всё время</button>
      </div>
      <div class="msg" id="dmsg" aria-live="polite"></div>

      <div class="panel" id="t-over"></div>

      <div class="panel" id="t-list" hidden>
        <div class="two">
          <label class="fl" for="xtype">Вид<select id="xtype"></select></label>
          <label class="fl" for="xstat">Статус<select id="xstat"><option value="">Любой</option><option value="new">Новый</option><option value="work">В работе</option><option value="done">Решён</option></select></label>
        </div>
        <div class="two">
          <label class="fl" for="xcls">Класс<select id="xcls"></select></label>
          <label class="fl" for="xq">Поиск<input type="text" id="xq" placeholder="Ученик, место, слово" autocomplete="off"></label>
        </div>

      </div>

      <div class="panel" id="t-stud" hidden></div>

      <div class="panel" id="t-rep" hidden>
        <div class="card">
          <h3>Отчёт для директора</h3>
          <pre class="rep" id="reptext"></pre>
          <div class="acts"><button class="btn sm" id="copyRep" type="button">Скопировать</button><span class="msg" id="cmsg" aria-live="polite"></span></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
/* ---------- Справочники ---------- */
var TYPES = ['Драка', 'Ссора, конфликт', 'Буллинг, травля', 'Оскорбления, угрозы', 'Порча имущества', 'Опасные предметы, курение', 'Прогул, уход с урока', 'Нарушение дисциплины', 'Другое'];
var PLACES = ['Класс', 'Коридор', 'Столовая', 'Школьный двор', 'Спортзал', 'Туалет', 'Лестница', 'Другое'];
var STAT = { new: 'Новый', work: 'В работе', done: 'Решён' };
var SEV = { 1: 'Лёгкая', 2: 'Средняя', 3: 'Тяжёлая' };
var MONTHS = ['янв.','фев.','мар.','апр.','мая','июн.','июл.','авг.','сент.','окт.','нояб.','дек.'];
var WD = ['вс','пн','вт','ср','чт','пт','сб'];

/* ---------- Состояние ---------- */
var S = { db: null, user: null, sample: null, uid: null, name: '', dean: false, canWrite: null, owner: false,
  inc: {}, rev: {}, mine: [], loaded: { inc: false, rev: false }, tab: 'over', period: 30, sev: 1, view: 'boot', busy: false };
var Q = Promise.resolve();
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseIso(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function fmtD(s) { var d = parseIso(s); return WD[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function plural(n, one, few, many) { var a = n % 10, b = n % 100; if (a === 1 && b !== 11) return one; if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few; return many; }
function clean(s, n) { return String(s == null ? '' : s).replace(/[ \t]+/g, ' ').trim().slice(0, n); }
function status(msg) { var n = $('status'); n.hidden = !msg; n.textContent = msg || ''; }
function show(v) {
  S.view = v;
  ['fatal', 'form', 'teacher', 'dean'].forEach(function (x) { $('v-' + x).hidden = x !== v; });
  $('newBtn').hidden = !(S.uid && (v === 'teacher' || v === 'dean'));
}
function fatal(title, text) {
  $('who').textContent = 'Нет подключения';
  var c = $('v-fatal'); c.textContent = '';
  var h = document.createElement('h2'); h.className = 'ttl'; h.textContent = title;
  var p = document.createElement('p'); p.className = 'muted'; p.textContent = text;
  c.appendChild(h); c.appendChild(p); show('fatal');
}

/* ---------- Данные ---------- */
function validItem(m) { return m && typeof m.id === 'string' && typeof m.d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(m.d) && typeof m.type === 'string'; }
function allIncidents() {
  var out = [];
  Object.keys(S.inc).forEach(function (uid) {
    var arr = S.inc[uid]; if (!Array.isArray(arr)) return;
    arr.forEach(function (m) { if (validItem(m)) out.push({ m: m, uid: uid, sample: uid === 'sample' || m.sample === true }); });
  });
  out.sort(function (a, b) { var x = a.m.d + (a.m.tm || ''), y = b.m.d + (b.m.tm || ''); return x < y ? 1 : x > y ? -1 : 0; });
  return out;
}
function stOf(id) { var r = S.rev[id]; return r && STAT[r.st] ? r.st : 'new'; }
function inPeriod(x) {
  if (!S.period) return true;
  var cut = new Date(); cut.setDate(cut.getDate() - S.period); return x.m.d >= iso(cut);
}
function whoList(m) { return Array.isArray(m.who) ? m.who.filter(function (w) { return w && typeof w.n === 'string'; }) : []; }
function classes(list) { var s = {}; list.forEach(function (x) { whoList(x.m).forEach(function (w) { if (w.c) s[clean(w.c, 6).toUpperCase()] = 1; }); }); return Object.keys(s).sort(); }
function whoText(m) { var w = whoList(m); return w.length ? w.map(function (p) { return clean(p.n, 50) + (p.c ? ' (' + clean(p.c, 6) + ')' : ''); }).join(', ') : 'Участники не указаны'; }
function sevTag(n) { return '<span class="tag ' + (n >= 3 ? 'red' : n === 2 ? 'mid' : '') + '">' + (SEV[n] || SEV[1]).toLowerCase() + '</span>'; }
function stTag(s) { return '<span class="tag ' + (s === 'new' ? 'red' : s === 'work' ? 'mid' : 'hi') + '">' + STAT[s] + '</span>'; }

/* ---------- Обзор ---------- */
function countBy(list, f) { var m = {}; list.forEach(function (x) { var k = f(x); m[k] = (m[k] || 0) + 1; }); return m; }
function weekStart(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); var wd = x.getDay(); x.setDate(x.getDate() - (wd === 0 ? 6 : wd - 1)); return x; }
function weeklySvg(list) {
  var N = 8, ws = weekStart(new Date()), keys = [], cnt = {};
  for (var i = N - 1; i >= 0; i--) { var d = new Date(ws); d.setDate(d.getDate() - 7 * i); keys.push(iso(d)); cnt[iso(d)] = 0; }
  list.forEach(function (x) { var k = iso(weekStart(parseIso(x.m.d))); if (k in cnt) cnt[k]++; });
  var mx = Math.max.apply(null, keys.map(function (k) { return cnt[k]; }).concat([1]));
  var W = 320, H = 130, L = 8, R = 8, T = 16, B = 20, pw = W - L - R, ph = H - T - B, bw = pw / N;
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Инциденты по неделям">';
  s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '"/>';
  keys.forEach(function (k, i) {

/* ---------- ИИ-сводка ---------- */
var aiCtl = null;
async function aiRun() {
  var list = allIncidents().filter(inPeriod);
  if (!list.length) { $('aiErr').textContent = 'За период нет инцидентов, пока нечего обобщать.'; return; }
  $('aiErr').textContent = ''; var out = $('aiOut'); out.hidden = false; out.textContent = 'Думаю…';
  $('aiBtn').disabled = true; $('aiStop').hidden = false; aiCtl = new AbortController();
  var lines = list.slice(0, 80).map(function (x) { var m = x.m; return m.d + ' ' + (m.tm || '') + ' | ' + m.type + ' | тяжесть ' + (m.sev || 1) + ' | ' + (m.place || '') + ' | ' + whoText(m) + ' | ' + clean(m.what, 160) + ' | причина: ' + clean(m.why, 120) + ' | статус: ' + STAT[stOf(m.id)]; });
  var prompt = 'Ты помощник завуча школы. Ниже список инцидентов за период (' + periodName() + '). Кратко опиши по-русски без Markdown-разметки (дефисы вместо маркеров): 1) главные тенденции (виды, места, время, классы); 2) ученики, на которых стоит обратить внимание (без обвинений, только факты); 3) 3–4 практичных шага для завуча. Не выдумывай ничего, чего нет в данных. Не более 12 строк.\n\n' + lines.join('\n');
  try {
    var r = await S.sample(prompt, { cache: false, modelTier: 'default', signal: aiCtl.signal, onText: function (u) { out.textContent = u.text; } });
    out.textContent = r.text;
  } catch (e) {
    if (e && e.text) out.textContent = e.text; else out.hidden = true;
    if (!e || e.code !== 'cancelled') $('aiErr').textContent = e && e.code === 'rate_limited' ? 'Слишком много запросов. Подождите немного.' : e && e.code === 'not_granted' ? 'ИИ недоступен для вашего аккаунта.' : 'Не получилось составить сводку. Попробуйте ещё раз.';
  } finally { $('aiBtn').disabled = false; $('aiStop').hidden = true; aiCtl = null; }
}

    b.disabled = true;

    return;
  }
  if (b.id === 'newBtn') { openForm(); return; }

    var ta = $('reptext').textContent;
    function fb() { var r = document.createRange(); r.selectNodeContents($('reptext')); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); $('cmsg').textContent = 'Текст выделен, скопируйте его вручную.'; }
    try { navigator.clipboard.writeText(ta).then(function () { $('cmsg').textContent = 'Отчёт скопирован.'; }, fb); } catch (err) { fb(); }
    return;
  }
});
['xtype', 'xstat', 'xcls'].forEach(function (id) { $(id).addEventListener('change', renderList); });
$('xq').addEventListener('input', renderList);
$('iform').addEventListener('submit', function (e) {
  e.preventDefault();
  var who = parseWho($('fwho').value), what = clean($('fwhat').value, 800), why = clean($('fwhy').value, 800);
  if (!$('fdate').value) { $('ferr').textContent = 'Укажите дату.'; return; }
  if (!who.length) { $('ferr').textContent = 'Укажите хотя бы одного участника.'; return; }
  if (what.length < 10) { $('ferr').textContent = 'Опишите, что произошло (не короче 10 символов).'; return; }
  if (why.length < 5) { $('ferr').textContent = 'Напишите, почему это произошло, со слов участников.'; return; }
  $('ferr').textContent = ''; $('fsave').disabled = true;
  var t = Date.now(), item = { id: 'i' + t.toString(36) + Math.floor(Math.random() * 1e4).toString(36), ts: t, d: $('fdate').value, tm: $('ftime').value || '', type: $('ftype').value, sev: S.sev, place: $('fplace').value, who: who, what: what, why: why, act: clean($('fact').value, 600), inj: $('finj').checked, par: $('fpar').checked, by: clean($('fby').value, 60) };
  writeMine(function (cur) { cur.push(item); return cur.slice(-150); }).then(function () {
    $('fsave').disabled = false; show(S.dean ? 'dean' : 'teacher');
    if (S.dean) { renderDean(); $('dmsg').textContent = 'Инцидент добавлен.'; setTimeout(function () { $('dmsg').textContent = ''; }, 2500); } else { renderTeacher(); $('tmsg').textContent = 'Отправлено завучу.'; }
  }, function (er) { $('fsave').disabled = false; $('ferr').textContent = er && er.code === 'quota_exceeded' ? 'Хранилище заполнено. Сообщите владельцу страницы.' : 'Не удалось отправить. Проверьте соединение и попробуйте ещё раз.'; });
});

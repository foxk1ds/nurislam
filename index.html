<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aibarys — Школьная цифровая система</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F7F4F4;
      --surface: #FFFFFF;
      --fg: #1E1315;
      --muted: #6B5C5F;
      --line: #E7DEDF;
      --red: #C8102E;
      --red-hover: #A00D24;
      --red-soft: #FCE8EB;
      --font-display: "Unbounded", system-ui, sans-serif;
      --font-body: "Golos Text", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 580px;
      background: var(--surface);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 12px 32px rgba(200, 16, 46, 0.06), 0 2px 6px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--line);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--red);
      color: #fff;
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      padding: 10px 24px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--fg);
    }

    p.subtitle {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.5;
    }

    .portals {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .portal-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 16px 20px;
      border-radius: 16px;
      transition: all 0.2s ease;
    }

    .portal-card:hover {
      background: var(--red-soft);
      border-color: rgba(200, 16, 46, 0.3);
      transform: translateY(-2px);
    }

    .portal-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .portal-title {
      font-weight: 600;
      font-size: 16px;
      color: var(--fg);
    }

    .portal-desc {
      font-size: 13px;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      width: 32px;
      height: 32px;
      line-height: 32px;
      text-align: center;
      background: #FFFFFF;
      border-radius: 50%;
      border: 1px solid var(--line);
      font-size: 16px;
    }

    .arrow {
      color: var(--red);
      font-weight: 700;
      font-size: 18px;
      margin-left: 12px;
      transition: transform 0.2s ease;
    }

    .portal-card:hover .arrow {
      transform: translateX(4px);
    }

    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo">AIBARYS</div>
      <h1>Выберите портал</h1>
      <p class="subtitle">Информационная система управления школой</p>
    </div>

    <div class="portals">
      <a href="/student" class="portal-card">
        <div style="display: flex; align-items: center; gap: 14px;">
          <span class="badge">🎓</span>
          <div class="portal-info">
            <span class="portal-title">Ученик</span>
            <span class="portal-desc">Дневник, расписание, рейтинг и баллы</span>
          </div>
        </div>
        <span class="arrow">→</span>
      </a>

      <a href="/teacher" class="portal-card">
        <div style="display: flex; align-items: center; gap: 14px;">
          <span class="badge">👩‍🏫</span>
          <div class="portal-info">
            <span class="portal-title">Учитель</span>
            <span class="portal-desc">Журнал оценивания, посещаемость и темы</span>
          </div>
        </div>
        <span class="arrow">→</span>
      </a>

      <a href="/parent" class="portal-card">
        <div style="display: flex; align-items: center; gap: 14px;">
          <span class="badge">👨‍👩‍👧</span>
          <div class="portal-info">
            <span class="portal-title">Родитель</span>
            <span class="portal-desc">Успеваемость детей, уведомления и отчеты</span>
          </div>
        </div>
        <span class="arrow">→</span>
      </a>


    <footer>
      Aibarys Digital School System &copy; 2026
    </footer>
  </div>

</body>
</html>
